<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>DEV — יחס (יעד 1.6) — כל הרכיבים</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }

    #dev-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #f9ca24; color: #1a1a2e;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 9999; font-size: 13px; font-weight: 700;
      direction: ltr;
      transition: background 0.2s ease;
    }
    /* review status of the CURRENT screen colors the whole bar:
       green = approved, striped strong-yellow = needs fixing */
    #dev-bar.st-ok  { background: #2ecc71; }
    #dev-bar.st-fix {
      background: repeating-linear-gradient(45deg, #f9ca24 0 18px, #f39c12 18px 36px);
    }
    .st-btn {
      height: 28px; width: 34px; border: none; border-radius: 4px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    #st-ok    { background: #1e8f4e; color: #fff; }
    #st-fix   { background: #b06f00; color: #fff; }
    #st-clear { background: #1a1a2e; color: #f9ca24; }
    #st-badge {
      min-width: 74px; text-align: center;
      padding: 3px 10px; border-radius: 1000px;
      background: rgba(26, 26, 46, 0.85); color: #fff; font-size: 12px;
    }
    #dev-bar span { background: #1a1a2e; color: #f9ca24; padding: 2px 8px; border-radius: 4px; }
    #dev-bar button {
      height: 28px; padding: 0 12px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #dev-bar button:hover { background: #333; }
    #dev-bar input[type=number] {
      width: 54px; height: 28px; border: none; border-radius: 4px;
      text-align: center; font-size: 14px; font-weight: 700;
    }
    #dev-bar select {
      height: 28px; max-width: 260px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; font-size: 13px;
      padding: 0 8px; cursor: pointer; direction: rtl;
    }
    #dev-label { margin-left: 6px; }

    #lomda-frame {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: calc(100% - 44px);
    }
  </style>
</head>
<body>

<div id="dev-bar">
  <span>DEV</span>
  <button onclick="nav(+1)" title="קדימה (RTL: שמאל = קדימה)">◀</button>
  <span id="dev-label">S 0 / ?</span>
  <button onclick="nav(-1)" title="אחורה (RTL: ימין = אחורה)">▶</button>
  <input type="number" id="jump-input" min="0" value="0" onkeydown="if(event.key==='Enter')jumpTo()">
  <button onclick="jumpTo()">Go</button>
  <select id="screen-select" onchange="send(parseInt(this.value, 10))"></select>
  <span id="st-badge">—</span>
  <button class="st-btn" id="st-ok"    onclick="setStatus('ok')"    title="מאושר — עברתי ואישרתי">✓</button>
  <button class="st-btn" id="st-fix"   onclick="setStatus('fix')"   title="דורש תיקון">!</button>
  <button class="st-btn" id="st-clear" onclick="setStatus(null)"    title="איפוס סטטוס">↺</button>
  <span style="margin-right:auto; font-size:11px; font-weight:400;">Ctrl+← קדימה &nbsp;|&nbsp; Ctrl+→ אחורה</span>
</div>

<iframe id="lomda-frame" src="./methodica-ar-math-ratio-06-01/index.html?v=1&dev=1"></iframe>

<script>
  /* Same DEV bar as the single-folder unit (units/methodica-ar-math-ratio-06/
     index_dev.html) — same markup, styles, screen picker, keyboard shortcuts
     and localStorage review marks, so a ✓/! set in either harness is the same
     mark. The ONLY addition is component routing: the screens live in four
     component folders, so a jump across a boundary swaps the iframe and then
     delivers the screen. */
  const UNIT_ID = 'methodica-ar-math-ratio-06';
  const UNIT_DIR = 'methodica-ar-math-ratio-06';
  /* Two components, named by the deck's own separator slides (2 and 6). */
  const PARTS = [
    { n: 1, start: 0, end: 2  },   // deck slides 3-5
    { n: 2, start: 3, end: 13 }    // deck slides 7-17
  ];
  const TOTAL_SCREENS = 14;

  let cur = 0;
  let total = TOTAL_SCREENS;
  let loadedPart = 1;
  let pending = null, pendTimer = null;

  const frame  = document.getElementById('lomda-frame');
  const label  = document.getElementById('dev-label');
  const input  = document.getElementById('jump-input');
  const select = document.getElementById('screen-select');

  const partOf = n => PARTS.find(p => n >= p.start && n <= p.end) || PARTS[0];

  const SCREEN_NAMES = [
    'הוק: מבצע ההתנדבות (שקף 3)',
    'שאלת הוק: כמה מוצרים יבשים? (שקף 4)',
    'הוק: מה נתרגל ביחידה (שקף 5)',
    'מעבר: אפשר להתחיל! (שקף 7)',
    'שאלה 1: אוטובוס — ילדים ומבוגרים (שקף 8)',
    'שאלה 2: שמיכת משבצות 3:5 (שקף 9)',
    'שאלה 3: צבע — 10 ליטרים (שקף 10)',
    'שאלה 4: תערובת זהב וכסף 1:4 (שקף 11)',
    'שאלה 5: התקציב השבועי של רוני (שקף 12)',
    'שאלה 6: צלעות מלבן 2:5 (שקף 13)',
    'שאלה 7: ניר (שקף 14)',
    'שאלה 8: קצב דפיקות הלב (שקף 15)',
    'שאלה 9: דשן לגינה (שקף 16)',
    'שאלה 10: כדורים אדומים וירוקים 5:7 (שקף 17)',
  ];

  function buildSelect(n) {
    select.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + ' — ' + (SCREEN_NAMES[i] || 'מסך ' + i) +
                        '  · רכיב ' + String(partOf(i).n).padStart(2, '0');
      select.appendChild(opt);
    }
    select.value = cur;
  }
  buildSelect(total);

  window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'DEV_READY') {
      total = Math.max(total, e.data.total || 0);
      buildSelect(total);
      if (pending !== null) post(pending);
      updateLabel();
    }
    if (e.data.type === 'DEV_SCREEN') {
      cur = e.data.screen;
      input.value = cur;
      if ([...select.options].some(o => Number(o.value) === cur)) select.value = cur;
      if (cur === pending) { pending = null; clearInterval(pendTimer); }
      updateLabel();
    }
  });

  const post = n => { try { frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: n }, '*'); } catch (err) {} };

  /* Delivering a screen to a JUST-LOADED component is a race: DEV_READY only
     fires on window 'load', which waits for every video, and frame.onload can
     land before the engine's listener exists. So retry DEV_GOTO on a short
     interval and stop the moment the component confirms with DEV_SCREEN. */
  function deliver(n) {
    pending = n; clearInterval(pendTimer);
    let tries = 0;
    pendTimer = setInterval(() => {
      if (pending === null || ++tries > 60) { clearInterval(pendTimer); return; }
      post(pending);
    }, 100);
  }

  function send(n) {
    n = Math.max(0, Math.min(total - 1, n));
    cur = n;
    input.value = n;
    select.value = n;
    const p = partOf(n);
    if (p.n !== loadedPart) {
      loadedPart = p.n;
      /* ?dev=1 = DEV_NAV (10-identity.js): the in-lomda buttons may still hop between
         components here; in production the platform routes and they report and stop. */
      frame.src = './' + UNIT_DIR + '-' + String(p.n).padStart(2, '0') + '/index.html?dev=1';
      deliver(n);
    } else {
      post(n);
    }
    updateLabel();
  }

  function nav(delta) {
    const next = Math.max(0, Math.min(total - 1, cur + delta));
    send(next);
  }

  function jumpTo() {
    const n = parseInt(input.value, 10);
    if (!isNaN(n) && n >= 0 && n < total) send(n);
  }

  function updateLabel() {
    label.textContent = 'S ' + cur + ' / ' + (total - 1) +
                        '  ·  רכיב ' + String(partOf(cur).n).padStart(2, '0');
    renderStatus();
  }

  /* ── review status (producer workflow): green = approved, yellow =
     needs fixing. Persisted per unit in localStorage — same key as the
     single-folder harness, so marks are shared. ── */
  const QA_ROUND = 'build1';
  const REVIEW_KEY = 'dev_review_' + UNIT_ID + '_' + QA_ROUND;
  function loadReview() {
    try { return JSON.parse(localStorage.getItem(REVIEW_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveReview(r) {
    try { localStorage.setItem(REVIEW_KEY, JSON.stringify(r)); } catch (e) {}
  }
  function setStatus(st) {
    const r = loadReview();
    if (st) r[cur] = st; else delete r[cur];
    saveReview(r);
    renderStatus();
  }
  function renderStatus() {
    const r = loadReview();
    const bar = document.getElementById('dev-bar');
    bar.classList.toggle('st-ok',  r[cur] === 'ok');
    bar.classList.toggle('st-fix', r[cur] === 'fix');
    const badge = document.getElementById('st-badge');
    badge.textContent = r[cur] === 'ok' ? 'מאושר ✓' : r[cur] === 'fix' ? 'לתיקון !' : '—';
    [...select.options].forEach(o => {
      const n = Number(o.value);
      const base = o.dataset.base || o.textContent;
      o.dataset.base = base;
      o.textContent = (r[n] === 'ok' ? '✓ ' : r[n] === 'fix' ? '⚠ ' : '') + base;
    });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'ArrowLeft')  nav(+1);
    if (e.ctrlKey && e.key === 'ArrowRight') nav(-1);
  });
  updateLabel();
</script>
</body>
</html>
